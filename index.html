<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Test</title></head>
<body style="background:#000;color:#fff;font-family:monospace;padding:20px;">
<h1>Vekil Listesi Testi</h1>
<div id="out">Test ediliyor...</div>
<script>
const rawMPText = `Adana|Abdullah DOĞRU|AK Parti
Adana|Ahmet ZENBİLCİ|BAĞIMSIZ
Adana|Ayhan BARUT|Yeni Parti
Ankara|Fuat OKTAY|AK Parti
İstanbul|Numan KURTULMUŞ|AK Parti
İzmir|Mahir POLAT|CHP`;

try{
  const lines = rawMPText.trim().split("\n");
  const db = lines.map((line,i)=>{
    const p = line.split("|");
    return {no:i+1, city:p[0], name:p[1], party:p[2]};
  }).filter(m=>m.city&&m.name&&m.party);
  
  let html = "✅ Toplam satır: " + lines.length + "<br>";
  html += "✅ Filtrelenmiş vekil: " + db.length + "<br><br>";
  html += "<b>İlk 5 vekil:</b><br>";
  db.slice(0,5).forEach(m=>{
    html += m.no + ". " + m.name + " — " + m.city + " — " + m.party + "<br>";
  });
  document.getElementById("out").innerHTML = html;
  alert("Vekil sayısı: " + db.length + " (beklenen: 6)");
}catch(e){
  document.getElementById("out").innerHTML = "❌ HATA: " + e.message;
  alert("HATA: " + e.message);
}
</script>
</body>
</html>
