<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7527 Oy Takip & Dilekçe Platformu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f17; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .target-card.active { border-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .print-only { display: none; }
        @media print {
            body * { visibility: hidden; }
            #printablePetition, #printablePetition * { visibility: visible; }
            #printablePetition { position: absolute; left: 0; top: 0; width: 100%; color: black; background: white; padding: 20px; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Navigasyon -->
    <nav class="border-b border-gray-800 bg-gray-950/90 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-red-500 text-2xl"><i class="fa-solid fa-paw"></i></span>
                <span class="font-bold text-lg tracking-wider text-white uppercase">YAŞAM HAKKI</span>
            </div>
            
            <div class="flex items-center space-x-6 text-sm font-medium">
                <a href="#vekil-listesi" class="text-gray-300 hover:text-white transition">Vekiller</a>
                <a href="#dilekce-modulu" class="text-gray-300 hover:text-white transition">Dilekçe Hazırla</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-10">

        <!-- Vekil Takip Tablosu -->
        <section id="vekil-listesi" class="space-y-4">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <h1 class="text-xl sm:text-2xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-landmark text-red-500"></i> Milletvekili Takip Paneli
                </h1>

                <!-- İmza Sayacı -->
                <div class="glass-card px-4 py-2 rounded-xl flex items-center gap-3 border-gray-800">
                    <span class="text-xs text-gray-400 font-semibold">İptal İmzası:</span>
                    <span class="text-base font-bold text-red-500"><span id="statSignedMps">0</span> / 200</span>
                    <div class="w-20 bg-gray-800 h-2 rounded-full overflow-hidden">
                        <div id="statProgressBar" class="bg-red-600 h-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Filtreler -->
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-2">
                <input type="text" id="searchInput" oninput="renderVekilData()" placeholder="Vekil adı, parti veya il..." class="bg-gray-900 border border-gray-800 text-xs sm:text-sm rounded-xl px-3.5 py-2.5 text-gray-200 focus:outline-none focus:border-red-500">
                
                <select id="partyFilter" onchange="renderVekilData()" class="bg-gray-900 border border-gray-800 text-xs sm:text-sm rounded-xl px-3.5 py-2.5 text-gray-200 focus:outline-none focus:border-red-500">
                    <option value="">Tüm Partiler</option>
                    <option value="CHP">CHP</option>
                    <option value="AK Parti">AK Parti</option>
                    <option value="DEM Parti">DEM Parti</option>
                    <option value="MHP">MHP</option>
                    <option value="İYİ Parti">İYİ Parti</option>
                </select>

                <select id="voteFilter" onchange="renderVekilData()" class="bg-gray-900 border border-gray-800 text-xs sm:text-sm rounded-xl px-3.5 py-2.5 text-gray-200 focus:outline-none focus:border-red-500">
                    <option value="">Tüm Meclis Oyları</option>
                    <option value="Kabul">Kabul</option>
                    <option value="Ret">Ret</option>
                    <option value="Katılmadı">Katılmadı</option>
                </select>

                <select id="statusFilter" onchange="renderVekilData()" class="bg-gray-900 border border-gray-800 text-xs sm:text-sm rounded-xl px-3.5 py-2.5 text-gray-200 focus:outline-none focus:border-red-500">
                    <option value="">Tüm İmza Durumları</option>
                    <option value="signed">İmza Verdi</option>
                    <option value="pending">İmza Vermedi</option>
                </select>
            </div>

            <!-- Tablo -->
            <div class="overflow-x-auto rounded-xl border border-gray-800 glass-card">
                <table class="w-full text-left text-sm text-gray-300">
                    <thead class="bg-gray-950 text-xs uppercase text-gray-400 font-semibold border-b border-gray-800">
                        <tr>
                            <th class="px-4 py-3">Milletvekili</th>
                            <th class="px-4 py-3">Parti</th>
                            <th class="px-4 py-3">Şehir</th>
                            <th class="px-4 py-3 text-center">Meclis Oyu</th>
                            <th class="px-4 py-3 text-center">İmza Durumu</th>
                            <th class="px-4 py-3 text-center">Aksiyon</th>
                        </tr>
                    </thead>
                    <tbody id="vekilTableBody" class="divide-y divide-gray-800/60 font-medium"></tbody>
                </table>
            </div>
        </section>

        <!-- Dilekçe Oluşturma Modülü -->
        <section id="dilekce-modulu" class="space-y-6 pt-6 border-t border-gray-800">
            <div>
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-file-signature text-red-500"></i> Dilekçe Oluştur
                </h2>
                <p class="text-xs text-gray-400">Göndermek istediğiniz makamı seçip bilgilerinizi girin.</p>
            </div>

            <!-- Seçmeli Alıcı Modülleri -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <button type="button" onclick="selectTarget('CB')" id="target-CB" class="target-card active glass-card p-4 rounded-xl text-left border transition cursor-pointer">
                    <div class="text-red-500 text-xl mb-2"><i class="fa-solid fa-building-columns"></i></div>
                    <div class="font-bold text-white text-sm">Cumhurbaşkanlığı</div>
                    <div class="text-xs text-gray-400 mt-1">T.C. Cumhurbaşkanlığı Makamına Hitaben</div>
                </button>

                <button type="button" onclick="selectTarget('TBMM')" id="target-TBMM" class="target-card glass-card p-4 rounded-xl text-left border border-gray-800 transition cursor-pointer">
                    <div class="text-red-500 text-xl mb-2"><i class="fa-solid fa-landmark"></i></div>
                    <div class="font-bold text-white text-sm">TBMM Başkanlığı</div>
                    <div class="text-xs text-gray-400 mt-1">TBMM Başkanlığı Makamına Hitaben</div>
                </button>

                <button type="button" onclick="selectTarget('VEKIL')" id="target-VEKIL" class="target-card glass-card p-4 rounded-xl text-left border border-gray-800 transition cursor-pointer">
                    <div class="text-red-500 text-xl mb-2"><i class="fa-solid fa-users"></i></div>
                    <div class="font-bold text-white text-sm">Milletvekilleri & Gruplar</div>
                    <div class="text-xs text-gray-400 mt-1">Parti Grupları ve Vekillere Hitaben</div>
                </button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                <!-- Form -->
                <div class="lg:col-span-5 glass-card p-5 rounded-xl border-gray-800 space-y-4">
                    <form id="petitionForm" onsubmit="handlePetitionSubmit(event)" class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-300 mb-1">Ad Soyad:</label>
                            <input type="text" id="signerName" oninput="updatePetitionPreview()" required placeholder="Adınız Soyadınız" class="w-full bg-gray-900 border border-gray-800 text-xs sm:text-sm rounded-lg px-3 py-2 text-white focus:outline-none focus:border-red-500">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-gray-300 mb-1">İl / İlçe:</label>
                            <input type="text" id="signerCity" oninput="updatePetitionPreview()" required placeholder="Örn: Ümraniye / İstanbul" class="w-full bg-gray-900 border border-gray-800 text-xs sm:text-sm rounded-lg px-3 py-2 text-white focus:outline-none focus:border-red-500">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-gray-300 mb-1">Adres / İletişim:</label>
                            <input type="text" id="signerAddress" oninput="updatePetitionPreview()" placeholder="Adres veya e-posta" class="w-full bg-gray-900 border border-gray-800 text-xs sm:text-sm rounded-lg px-3 py-2 text-white focus:outline-none focus:border-red-500">
                        </div>

                        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 rounded-lg text-xs sm:text-sm transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-check"></i> Dilekçeyi Tamamla & Kaydet
                        </button>
                    </form>
                </div>

                <!-- Çıktı / Dilekçe Metni -->
                <div class="lg:col-span-7 glass-card p-5 rounded-xl border-gray-800 space-y-3">
                    <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                        <span class="text-xs font-semibold text-gray-300">Dilekçe Metni</span>
                        <div class="flex gap-2">
                            <button onclick="copyPetitionText()" class="bg-gray-800 hover:bg-gray-700 text-xs text-gray-200 px-2.5 py-1 rounded border border-gray-700 transition flex items-center gap-1">
                                <i class="fa-regular fa-copy"></i> Kopyala
                            </button>
                            <button onclick="window.print()" class="bg-gray-800 hover:bg-gray-700 text-xs text-gray-200 px-2.5 py-1 rounded border border-gray-700 transition flex items-center gap-1">
                                <i class="fa-solid fa-print"></i> Yazdır
                            </button>
                        </div>
                    </div>

                    <div id="petitionDisplay" class="bg-gray-950 p-4 rounded-lg border border-gray-800 text-xs text-gray-200 font-mono leading-relaxed space-y-2 min-h-[220px]"></div>
                    <div id="printablePetition" class="print-only"></div>
                </div>
            </div>
        </section>

    </main>

    <footer class="border-t border-gray-800 bg-gray-950 text-center py-4 text-xs text-gray-500">
        Yaşam Hakkı Platformu © 2026
    </footer>

    <script>
        let selectedTarget = 'CB';

        let vekiller = JSON.parse(localStorage.getItem('vekil_listesi')) || [
            { id: 1, name: "Ahmet Yılmaz", party: "CHP", city: "İstanbul", vote: "Ret", signed: true },
            { id: 2, name: "Mehmet Demir", party: "CHP", city: "Ankara", vote: "Ret", signed: true },
            { id: 3, name: "Ayşe Kaya", party: "AK Parti", city: "İzmir", vote: "Kabul", signed: false },
            { id: 4, name: "Ali Can", party: "DEM Parti", city: "Diyarbakır", vote: "Ret", signed: true },
            { id: 5, name: "Fatma Şahin", party: "AK Parti", city: "Bursa", vote: "Kabul", signed: false },
            { id: 6, name: "Mustafa Çelik", party: "MHP", city: "Adana", vote: "Kabul", signed: false },
            { id: 7, name: "Zeynep Arslan", party: "İYİ Parti", city: "Antalya", vote: "Katılmadı", signed: false }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            renderVekilData();
            updatePetitionPreview();
        });

        function selectTarget(target) {
            selectedTarget = target;
            document.querySelectorAll('.target-card').forEach(card => card.classList.remove('active'));
            document.getElementById(`target-${target}`).classList.add('active');
            updatePetitionPreview();
        }

        function renderVekilData() {
            const tbody = document.getElementById("vekilTableBody");
            const search = document.getElementById("searchInput").value.toLowerCase();
            const party = document.getElementById("partyFilter").value;
            const vote = document.getElementById("voteFilter").value;
            const status = document.getElementById("statusFilter").value;

            tbody.innerHTML = "";

            const signedCount = vekiller.filter(v => v.signed).length;
            document.getElementById("statSignedMps").innerText = signedCount;
            const percentage = Math.round((signedCount / 200) * 100);
            document.getElementById("statProgressBar").style.width = `${Math.min(percentage, 100)}%`;

            const filtered = vekiller.filter(v => {
                const matchesSearch = v.name.toLowerCase().includes(search) || v.party.toLowerCase().includes(search) || v.city.toLowerCase().includes(search);
                const matchesParty = party === "" || v.party === party;
                const matchesVote = vote === "" || v.vote === vote;
                const matchesStatus = status === "" || (status === "signed" ? v.signed : !v.signed);
                return matchesSearch && matchesParty && matchesVote && matchesStatus;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-gray-500 text-xs">Sonuç bulunamadı.</td></tr>`;
                return;
            }

            filtered.forEach(v => {
                let voteBadge = "";
                if (v.vote === "Kabul") voteBadge = `<span class="bg-red-950 text-red-400 border border-red-800/80 text-[11px] px-2 py-0.5 rounded font-semibold">Kabul</span>`;
                else if (v.vote === "Ret") voteBadge = `<span class="bg-emerald-950 text-emerald-400 border border-emerald-800/80 text-[11px] px-2 py-0.5 rounded font-semibold">Ret</span>`;
                else voteBadge = `<span class="bg-gray-800 text-gray-400 border border-gray-700 text-[11px] px-2 py-0.5 rounded font-semibold">Katılmadı</span>`;

                // İmzacı ise "İmzaladı" butonu, imzacı değilse tek tıkla "Çağrı Yap"
                const actionButton = v.signed 
                    ? `<button onclick="toggleSignature(${v.id})" class="text-xs bg-emerald-950 hover:bg-emerald-900 text-emerald-300 border border-emerald-800 px-3 py-1 rounded transition flex items-center gap-1 mx-auto"><i class="fa-solid fa-check"></i> İmzaladı</button>`
                    : `<button onclick="pressureVekil('${v.name}', '${v.party}')" class="text-xs bg-red-600 hover:bg-red-700 text-white font-medium px-3 py-1 rounded transition flex items-center gap-1 mx-auto"><i class="fa-brands fa-x-twitter"></i> Çağrı Yap</button>`;

                const tr = document.createElement("tr");
                tr.className = "hover:bg-gray-900/40 transition";
                tr.innerHTML = `
                    <td class="px-4 py-3 font-semibold text-white">${v.name}</td>
                    <td class="px-4 py-3"><span class="bg-gray-800 text-gray-200 border border-gray-700 text-xs px-2 py-0.5 rounded">${v.party}</span></td>
                    <td class="px-4 py-3 text-gray-400">${v.city}</td>
                    <td class="px-4 py-3 text-center">${voteBadge}</td>
                    <td class="px-4 py-3 text-center">
                        ${v.signed 
                            ? `<span class="text-emerald-400 font-semibold text-xs"><i class="fa-solid fa-check"></i> İmzada</span>` 
                            : `<span class="text-red-400 font-semibold text-xs"><i class="fa-solid fa-xmark"></i> Yok</span>`}
                    </td>
                    <td class="px-4 py-3 text-center">${actionButton}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleSignature(id) {
            const index = vekiller.findIndex(v => v.id === id);
            if (index !== -1) {
                vekiller[index].signed = !vekiller[index].signed;
                localStorage.setItem('vekil_listesi', JSON.stringify(vekiller));
                renderVekilData();
            }
        }

        function pressureVekil(name, party) {
            const tweet = encodeURIComponent(`Sayın ${name} (${party}), 7527 Sayılı Kanun'a karşı Anayasa Mahkemesi iptal başvurusuna imzanızla destek verin! #7527İptal #YaşamHakkı`);
            window.open(`https://twitter.com/intent/tweet?text=${tweet}`, '_blank');
        }

        function updatePetitionPreview() {
            const name = document.getElementById("signerName").value.trim() || "[Ad Soyad]";
            const city = document.getElementById("signerCity").value.trim() || "[İl / İlçe]";
            const address = document.getElementById("signerAddress").value.trim() || "[Adres / İletişim]";

            let headerText = "";
            if (selectedTarget === "CB") headerText = "T.C. CUMHURBAŞKANLIĞI MAKAMINA";
            else if (selectedTarget === "TBMM") headerText = "TÜRKİYE BÜYÜK MİLLET MECLİSİ BAŞKANLIĞINA";
            else headerText = "TBMM SİYASİ PARTİ GRUP BAŞKANLIKLARINA VE MİLLETVEKİLLERİNE";

            const petitionHTML = `
                <div class="text-center font-bold underline mb-3 text-white text-xs sm:text-sm">${headerText}</div>
                <p><strong>KONU:</strong> 7527 Sayılı Kanun'un uygulanması ve iptali talebi hakkındadır.</p>
                <p>7527 sayılı Kanun'un yürürlüğe girmesinden bu yana yaşanan hak ihlalleri ve kamu vicdanını yaralayan uygulamalar sebebiyle;</p>
                <p>1. Uygulamaların acilen durdurulmasını,</p>
                <p>2. Kanunun yaşam hakkı ilkeleri çerçevesinde yeniden değerlendirilerek iptal sürecine destek verilmesini arz ve talep ederim.</p>
                <br>
                <div class="flex justify-between items-end border-t border-gray-800 pt-3">
                    <div>
                        <p><strong>BAŞVURU SAHİBİ:</strong> ${name}</p>
                        <p><strong>KONUM:</strong> ${city}</p>
                        <p><strong>İLETİŞİM:</strong> ${address}</p>
                    </div>
                    <div class="text-right">
                        <p><strong>TARİH:</strong> ${new Date().toLocaleDateString('tr-TR')}</p>
                    </div>
                </div>
            `;

            document.getElementById("petitionDisplay").innerHTML = petitionHTML;
            document.getElementById("printablePetition").innerHTML = petitionHTML;
        }

        function handlePetitionSubmit(e) {
            e.preventDefault();
            alert("Dilekçe kaydınız tamamlandı. Kopyalayabilir veya yazdırabilirsiniz.");
        }

        function copyPetitionText() {
            const text = document.getElementById("petitionDisplay").innerText;
            navigator.clipboard.writeText(text);
            alert("Dilekçe metni kopyalandı!");
        }
    </script>
</body>
</html>
