<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sticker + QR Üretici</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif}.font-impact{font-family:'Oswald',sans-serif;letter-spacing:1px}
#qr-hidden{position:fixed;left:-9999px;top:-9999px}
</style>
</head>
<body class="bg-zinc-950 text-zinc-100 p-6 min-h-screen">

<div class="max-w-4xl mx-auto space-y-6">
<h1 class="font-impact text-3xl text-red-500 uppercase text-center">STICKER ÜRETİCİ</h1>

<div class="bg-zinc-900 p-5 rounded-xl border border-zinc-800 space-y-4">
<div>
<label class="block text-xs font-bold text-zinc-400 mb-1">KAMPANYA LİNKİ</label>
<input id="url" type="url" value="https://sickboycheug.github.io/7527-iptal/" class="w-full bg-zinc-950 border border-zinc-700 rounded px-3 py-2 text-sm">
</div>
<div class="grid grid-cols-2 gap-3">
<div>
<label class="block text-xs font-bold text-zinc-400 mb-1">BAŞLANGIÇ TARİHİ</label>
<input id="date" type="text" value="22 EYLÜL SALI" class="w-full bg-zinc-950 border border-zinc-700 rounded px-3 py-2 text-sm">
</div>
<div>
<label class="block text-xs font-bold text-zinc-400 mb-1">SAAT</label>
<input id="time" type="text" value="10:00" class="w-full bg-zinc-950 border border-zinc-700 rounded px-3 py-2 text-sm">
</div>
</div>
</div>

<div id="qr-hidden"></div>

<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
<div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 space-y-3">
<h3 class="text-sm font-bold text-center">📱 GÖNDERİ (1080×1080)</h3>
<canvas id="c1" width="1080" height="1080" class="w-full border border-zinc-700 rounded"></canvas>
<button onclick="download('c1','sticker-gonderi.png')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded text-xs uppercase">⬇️ PNG İNDİR</button>
</div>
<div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 space-y-3">
<h3 class="text-sm font-bold text-center">📱 STORY (1080×1920)</h3>
<canvas id="c2" width="1080" height="1920" class="w-full border border-zinc-700 rounded"></canvas>
<button onclick="download('c2','sticker-story.png')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded text-xs uppercase">⬇️ PNG İNDİR</button>
</div>
<div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 space-y-3">
<h3 class="text-sm font-bold text-center">🖨️ BASKI (600×600)</h3>
<canvas id="c3" width="600" height="600" class="w-full border border-zinc-700 rounded"></canvas>
<button onclick="download('c3','sticker-baski.png')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded text-xs uppercase">⬇️ PNG İNDİR</button>
</div>
</div>

<p class="text-xs text-zinc-500 text-center">Baskı için: PNG'yi yazıcıda "A4 — 6 adet sayfada" seçerek bastırabilirsin.</p>
</div>

<script>
function getQRDataURL(cb){
const url=document.getElementById('url').value.trim();
if(!url){alert('Lütfen link gir');return;}
const h=document.getElementById('qr-hidden');
h.innerHTML='';
new QRCode(h,{text:url,width:512,height:512,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
setTimeout(function(){
const c=h.querySelector('canvas');
if(!c){alert('QR oluşturulamadı');return;}
cb(c.toDataURL('image/png'));
},300);
}

function drawSticker(canvasId,size,withStoryFooter){
const cv=document.getElementById(canvasId);
const c=cv.getContext('2d');
const W=size,H=withStoryFooter?Math.round(size*1920/1080):size;
const date=document.getElementById('date').value.trim();
const time=document.getElementById('time').value.trim();

getQRDataURL(function(qrData){
const img=new Image();
img.onload=function(){
// ARKA
c.fillStyle='#09090b';c.fillRect(0,0,W,H);
// Kırmızı kenar
c.strokeStyle='#dc2626';c.lineWidth=Math.round(W*0.012);c.strokeRect(W*0.02,H*0.02,W*0.96,H*0.96);
// ÜST KIRMIZI BAR
const barH=Math.round(H*0.09);
c.fillStyle='#dc2626';c.fillRect(W*0.05,H*0.045,W*0.9,barH);
c.fillStyle='#ffffff';c.textAlign='center';
c.font='bold '+Math.round(W*0.075)+'px Oswald, Arial';
c.fillText('7527 İPTAL!',W/2,H*0.045+barH*0.72);

// ALT BAŞLIK
c.fillStyle='#fca5a5';c.font='bold '+Math.round(W*0.045)+'px Oswald, Arial';
c.fillText('İMZA KAPISI AÇILIYOR',W/2,H*0.19);

// TARİH
c.fillStyle='#ffffff';c.font='bold '+Math.round(W*0.075)+'px Oswald, Arial';
c.fillText(date,W/2,H*0.255);
c.fillStyle='#dc2626';c.font='bold '+Math.round(W*0.06)+'px Oswald, Arial';
c.fillText(time,W/2,H*0.315);

// QR BEYAZ KUTU
const qrSize=Math.round(W*0.52);
const qrX=(W-qrSize)/2, qrY=H*0.36;
c.fillStyle='#ffffff';
c.fillRect(qrX-8,qrY-8,qrSize+16,qrSize+16);
c.drawImage(img,qrX,qrY,qrSize,qrSize);

// QR ALT YAZI
c.fillStyle='#ffffff';c.font='bold '+Math.round(W*0.036)+'px Inter, Arial';
c.fillText('KAREKODU OKUT',W/2,qrY+qrSize+Math.round(H*0.055));
c.fillStyle='#a1a1aa';c.font=Math.round(W*0.025)+'px Inter, Arial';
c.fillText('sickboycheug.github.io/7527-iptal',W/2,qrY+qrSize+Math.round(H*0.085));

if(withStoryFooter){
// Ekstra alt metin (story için)
c.fillStyle='#dc2626';c.fillRect(W*0.05,H*0.86,W*0.9,Math.round(H*0.11));
c.fillStyle='#ffffff';c.font='bold '+Math.round(W*0.055)+'px Oswald, Arial';
c.fillText('BİR İMZA, BİR CAN',W/2,H*0.895);
c.font='bold '+Math.round(W*0.035)+'px Inter, Arial';
c.fillStyle='#fecaca';
c.fillText('ÖLDÜREN DEĞİL, YAŞATAN OL!',W/2,H*0.94);
}else{
c.fillStyle='#dc2626';c.font='bold '+Math.round(W*0.045)+'px Oswald, Arial';
c.fillText('BİR İMZA, BİR CAN',W/2,H*0.945);
c.fillStyle='#71717a';c.font=Math.round(W*0.022)+'px Inter, Arial';
c.fillText('ÖLDÜREN DEĞİL, YAŞATAN OL',W/2,H*0.975);
}
};
img.src=qrData;
});
}

function renderAll(){
drawSticker('c1',1080,false);
drawSticker('c2',1080,true);
drawSticker('c3',600,false);
}

function download(id,name){
const cv=document.getElementById(id);
const a=document.createElement('a');
a.download=name;
a.href=cv.toDataURL('image/png');
a.click();
}

document.getElementById('url').addEventListener('input',renderAll);
document.getElementById('date').addEventListener('input',renderAll);
document.getElementById('time').addEventListener('input',renderAll);

window.addEventListener('load',function(){setTimeout(renderAll,500);});
</script>
</body>
</html>
