<!-- Kodu tam olarak çalıştırmak için JS kısmındaki düzeltilmiş fonksiyonlar: -->
<script>
// TBMM Kurumsal E-posta Üretici (Fallback)
function generateTbmmEmail(name) {
  var normalized = (name || '').toLowerCase()
    .replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ş/g, 's')
    .replace(/ı/g, 'i').replace(/ö/g, 'o').replace(/ç/g, 'c')
    .replace(/[^a-z\s]/g, '').trim();
  var parts = normalized.split(/\s+/);
  if (parts.length < 2) return normalized + '@tbmm.gov.tr';
  return parts.slice(0, -1).join('.') + '.' + parts[parts.length - 1] + '@tbmm.gov.tr';
}

// Güvenli Arayüz Başlatıcı
async function initPage() {
  // 1. Önce TÜM Arayüzü Sıfır Gecikmeyle Başlat:
  updateCounters();
  populateCityDropdown();
  populateVekilSelect();
  initCitizenSignaturePad();
  initMPSignaturePad();
  renderSignedMPs();
  populateAlmanacFilters();
  loadStoredAlmanac();
  renderAlmanac();
  initCampaignQR();
  populateFilterCityMode();
  populateVolCity();
  filterVekilRadio();

  // 2. Ağ Çağrılarını Arka Planda Güvenle Çalıştır (UI'ı Dondurmaz):
  try { await loadOfficialMPEmails(); } catch(e) { console.warn('Vekil e-posta ağı:', e); }
  try { await refreshRemoteCounters(); } catch(e) { console.warn('Sayaç ağı:', e); }
}

// Canvas Resize Koruması (İmzayı Silmez)
window.addEventListener('resize', function () {
  if (canvas && ctx) {
    var data = canvas.toDataURL();
    var w = canvas.offsetWidth;
    if (w > 0 && w !== canvas.width) {
      canvas.width = w;
      var img = new Image();
      img.onload = function() { ctx.drawImage(img, 0, 0); };
      img.src = data;
    }
  }
});
</script>
