<script>
(function () {
  var D = {"ig": "Gurbetteki yurttaşlarımıza çağrımızdır:\n\nTürkiye'de 7527 sayılı yasayla masum canlar toplanıyor, kapatılıyor, öldürülüyor. Uzakta olman sesinin uzak olduğu anlamına gelmiyor. Senden iki şey istiyoruz:\n\nKatledilenlerin son çığlığı ve hapsedilenlerin sesi olmak için bütün dilekçeleri gönder. Yasanın iptali için, yaşam hakkı için, hayvanlarımız için ve geleceğimiz için. Cumhurbaşkanlığı'na, TBMM Başkanlığı'na ve vekillere giden her dilekçe, bu vahşetin bitmesi için bir adım. Formda \"Yurtdışında yaşıyorum\"u işaretlemen yeterli.\n\nYaşadığın ülkede sesimiz ol. Gönüllü ol; Türkiye'de olanları bulunduğun şehirde anlat, kamuoyu oluştur. Bu vahşet, dünya duymadan durmayacak.\n\nÖldüren değil, yaşatan ol!\n7527iptal.org\n\n———\n\nUn llamamiento a nuestros compatriotas en el extranjero:\n\nEn Turquía, con la ley n.º 7527, vidas inocentes son capturadas, encerradas y asesinadas. Estar lejos no significa que tu voz esté lejos. Te pedimos dos cosas:\n\nEnvía todas las peticiones para ser el último grito de quienes son asesinados y la voz de quienes están encerrados. Por la derogación de la ley, por el derecho a la vida, por nuestros animales y por nuestro futuro. Cada petición a la Presidencia, a la presidencia del Parlamento y a los diputados es un paso para acabar con esta barbarie. En el formulario basta con marcar \"Yurtdışında yaşıyorum\" (Vivo en el extranjero).\n\nSé nuestra voz en el país donde vives. Hazte voluntario: cuenta en tu ciudad lo que está pasando en Turquía y crea conciencia. Esta barbarie no terminará mientras el mundo no la escuche.\n\n¡No seas quien mata, sé quien da vida!\n7527iptal.org\n\n#7527İptal #España #Madrid #Barcelona #Valencia", "x": "Uzakta olman sesinin uzak olduğu anlamına gelmiyor. Bütün dilekçeleri gönder!\nEstar lejos no significa que tu voz esté lejos.\n\n#7527İptal #España #Madrid #Barcelona #Valencia #Sevilla #Málaga #Bilbao #Zaragoza #Alicante #Murcia #Palma #LasPalmas #Tenerife #Granada #Marbella", "url": "https://7527iptal.org/cagri/paylas-cagri-es.html", "img": "cagri-es-ig.jpg", "ok": "Kopyalandı"};
