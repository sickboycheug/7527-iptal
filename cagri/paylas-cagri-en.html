<script>
(function () {
  var D = {"ig": "Gurbetteki yurttaşlarımıza çağrımızdır:\n\nTürkiye'de 7527 sayılı yasayla masum canlar toplanıyor, kapatılıyor, öldürülüyor. Uzakta olman sesinin uzak olduğu anlamına gelmiyor. Senden iki şey istiyoruz:\n\nKatledilenlerin son çığlığı ve hapsedilenlerin sesi olmak için bütün dilekçeleri gönder. Yasanın iptali için, yaşam hakkı için, hayvanlarımız için ve geleceğimiz için. Cumhurbaşkanlığı'na, TBMM Başkanlığı'na ve vekillere giden her dilekçe, bu vahşetin bitmesi için bir adım. Formda \"Yurtdışında yaşıyorum\"u işaretlemen yeterli.\n\nYaşadığın ülkede sesimiz ol. Gönüllü ol; Türkiye'de olanları bulunduğun şehirde anlat, kamuoyu oluştur. Bu vahşet, dünya duymadan durmayacak.\n\nÖldüren değil, yaşatan ol!\n7527iptal.org\n\n———\n\nA call to our fellow citizens abroad:\n\nIn Türkiye, under Law No. 7527, innocent lives are being rounded up, locked away and killed. Being far away does not mean your voice is far away. We ask you for two things:\n\nSend all the petitions to be the last cry of those killed and the voice of those locked away. For the repeal of the law, for the right to life, for our animals and for our future. Every petition to the Presidency, the Speaker of Parliament and the MPs is a step towards ending this cruelty. On the form, just tick \"Yurtdışında yaşıyorum\" (I live abroad).\n\nBe our voice in the country you live in. Volunteer: tell people in your city what is happening in Türkiye and build public awareness. This cruelty will not end until the world hears about it.\n\nDon't be the one who kills, be the one who lets live!\n7527iptal.org\n\n#7527İptal #London #NewYork #Toronto #Sydney", "x": "Uzakta olman sesinin uzak olduğu anlamına gelmiyor. Bütün dilekçeleri gönder!\nBeing far away does not mean your voice is far away.\n\n#7527İptal #UnitedKingdom #Ireland #USA #Canada #Australia #NewZealand #London #Hackney #Haringey #Enfield #Islington #GreenLanes #Edmonton #Manchester #Birmingham #Dublin #NewYork #Brooklyn #NewJersey #Paterson #Chicago #Houston #LosAngeles #Toronto #Montreal #Vancouver #Sydney #Auburn #Melbourne #Broadmeadows #Auckland", "url": "https://7527iptal.org/cagri/paylas-cagri-en.html", "img": "cagri-en-ig.jpg", "ok": "Kopyalandı"};
  var q = encodeURIComponent, $ = function (i) { return document.getElementById(i); };
  function durum(t) { $('st').textContent = t; setTimeout(function () { $('st').textContent = ''; }, 3000); }
  function kopyala(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(function () { durum('✓ ' + D.ok); }, function () { yedek(t); });
    yedek(t); return Promise.resolve();
  }
  function yedek(t) { var a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); durum('✓ ' + D.ok); } catch (e) {} document.body.removeChild(a); }
  $('wa').href = 'https://api.whatsapp.com/send?text=' + q(D.ig.split('\n\n')[1] + '\n\n' + D.url);
  $('tg').href = 'https://t.me/share/url?url=' + q(D.url) + '&text=' + q(D.ig.split('\n\n')[1]);
  $('fb').href = 'https://www.facebook.com/sharer/sharer.php?u=' + q(D.url);
  $('dl').href = D.img;
  $('xx').onclick = function () { window.open('https://twitter.com/intent/tweet?text=' + q(D.x) + '&url=' + q(D.url), '_blank'); };
  $('cp').onclick = function () { kopyala(D.ig); };
  $('sh').onclick = function () {
    kopyala(D.ig);
    fetch(D.img).then(function (r) { return r.blob(); }).then(function (bl) {
      var f = new File([bl], D.img, { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [f] })) return navigator.share({ files: [f], text: D.ig });
      var a = document.createElement('a'); a.href = D.img; a.download = D.img; document.body.appendChild(a); a.click(); a.remove();
    }).catch(function () {});
  };
})();
</script>
