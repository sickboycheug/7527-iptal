<script>
(function () {
  var D = {"ig": "Gurbetteki yurttaşlarımıza çağrımızdır:\n\nTürkiye'de 7527 sayılı yasayla masum canlar toplanıyor, kapatılıyor, öldürülüyor. Uzakta olman sesinin uzak olduğu anlamına gelmiyor. Senden iki şey istiyoruz:\n\nKatledilenlerin son çığlığı ve hapsedilenlerin sesi olmak için bütün dilekçeleri gönder. Yasanın iptali için, yaşam hakkı için, hayvanlarımız için ve geleceğimiz için. Cumhurbaşkanlığı'na, TBMM Başkanlığı'na ve vekillere giden her dilekçe, bu vahşetin bitmesi için bir adım. Formda \"Yurtdışında yaşıyorum\"u işaretlemen yeterli.\n\nYaşadığın ülkede sesimiz ol. Gönüllü ol; Türkiye'de olanları bulunduğun şehirde anlat, kamuoyu oluştur. Bu vahşet, dünya duymadan durmayacak.\n\nÖldüren değil, yaşatan ol!\n7527iptal.org\n\n———\n\nEn oppfordring til våre landsmenn i utlandet:\n\nI Tyrkia blir uskyldige liv fanget, sperret inne og drept på grunn av lov nr. 7527. At du er langt borte, betyr ikke at stemmen din er langt borte. Vi ber deg om to ting:\n\nSend alle petisjonene for å være det siste skriket fra de drepte og stemmen til de innesperrede. For opphevelsen av loven, for retten til liv, for dyrene våre og for fremtiden vår. Hver petisjon til presidentembetet, parlamentets president og parlamentsmedlemmene er et steg mot å stanse denne grusomheten. I skjemaet holder det å krysse av for \"Yurtdışında yaşıyorum\" (Jeg bor i utlandet).\n\nVær vår stemme i landet der du bor. Bli frivillig: fortell i byen din hva som skjer i Tyrkia, og skap engasjement. Denne grusomheten stanser ikke før verden hører om den.\n\nIkke vær den som dreper – vær den som lar leve!\n7527iptal.org\n\n#7527İptal #Norge #Oslo #Drammen #Bergen", "x": "Uzakta olman sesinin uzak olduğu anlamına gelmiyor. Bütün dilekçeleri gönder!\nAt du er langt borte, betyr ikke at stemmen din er langt borte.\n\n#7527İptal #Norge #Oslo #Grønland #Groruddalen #Drammen #Lillestrøm #Bergen #Trondheim #Stavanger #Kristiansand #Fredrikstad #Sarpsborg #Tromsø", "url": "https://7527iptal.org/cagri/paylas-cag
